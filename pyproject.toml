[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotube-creator"
version = "1.0.0"
description = "Automatically convert a script and voiceover into a ready-to-upload YouTube video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AutoTube Creator" }]
dependencies = [
    "PySide6>=6.6",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
autotube = "autotube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "integration: real FFmpeg/FFprobe integration tests (deselect with '-m \"not integration\"')",
    "whisper: real faster-whisper integration tests (opt-in via AUTOTUBE_RUN_WHISPER_TESTS=1)",
    "stock: real stock provider integration tests (opt-in via AUTOTUBE_RUN_STOCK_TESTS=1)",
    "ai: real AI provider integration tests (opt-in via AUTOTUBE_RUN_AI_TESTS=1)",
]
